<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f45c8'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='21' width='7' height='3' rx='1.5' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/plex-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/plex-sans-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Keitaro wrapper, на главную">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f45c8"/><rect x="7" y="9" width="18" height="3" rx="1.5" fill="#fff"/><rect x="7" y="15" width="12" height="3" rx="1.5" fill="#fff"/><rect x="7" y="21" width="7" height="3" rx="1.5" fill="#fff" opacity=".6"/></svg>
      <span>Keitaro wrapper</span>
    </a>
    {% if tracker_host %}
    <span class="tracker" title="Все действия уходят в общий боевой Keitaro">
      <span class="label-text">Боевой трекер</span><span class="mono">{{ tracker_host }}</span>
    </span>
    {% endif %}
  </header>
  <main class="page" id="main">{% block content %}{% endblock %}</main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="sr-only" id="sr-status" role="status"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
